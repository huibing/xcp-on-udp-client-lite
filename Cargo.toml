[package]
name = "xcp_client"
version = "0.1.0"
edition = "2021"
description = "XCP Master client for calibration and DAQ"

[dependencies]
tokio = { version = "=1.43.0", features = ["full"] }
bytes = "=1.9.0"
thiserror = "=1.0.69"
tracing = "=0.1.41"
tracing-subscriber = { version = "=0.3.19", features = ["env-filter"] }
csv = "=1.3.1"
chrono = { version = "=0.4.39", features = ["serde"] }
serde = { version = "=1.0.217", features = ["derive"] }
serde_json = "=1.0.138"
ratatui = "=0.27.0"
crossterm = { version = "=0.27.0", features = ["event-stream"] }
tui-input = "=0.9.0"
tokio-util = "=0.7.13"
bitflags = "=2.6.0"
regex = "=1.10.6"
a2lfile = "=2.3.0"

# Web UI dependencies
axum = { version = "=0.7.5", features = ["ws", "multipart"] }
tower-http = { version = "=0.5.2", features = ["fs", "trace"] }
tower = { version = "=0.4.13", features = ["util"] }
askama = "=0.12.1"
handlebars = "=6.0.0"
once_cell = "=1.20.2"
base64 = "=0.22.1"
sha2 = "=0.10.8"
hex = "=0.4.3"
clap = { version = "=4.5.23", features = ["derive"] }
urlencoding = "=2.1.3"
async-trait = "=0.1"
uuid = { version = "=1.6", features = ["v4", "serde"] }

[profile.release]
opt-level = 3
lto = true
