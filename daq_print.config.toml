# ---------------------------------------------------------------------------
# Single-slave shorthand: instead of [[slaves]] you may use the same top-level
# layout as daq_record.config.toml:
#
#   a2l = "pms-a.a2l"
#
#   [connection]
#   type = "can"
#
#   [daq]
#   event_channel = 0
#
#   [[events]]
#   channel = 0
#   decimation = 100
#   measurements = ["CAN1_TX_PMS02_PMS_MAXTEMP"]
# ---------------------------------------------------------------------------